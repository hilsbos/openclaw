# Local overrides — auto-loaded by docker compose on top of docker-compose.yml.
# Tracked in git (part of the custom branch); treat edits as committed changes.
services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file:
      - .env
    environment:
      NODE_ENV: production
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT}
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD}
      OPENCLAW_HOOKS_TOKEN: ${OPENCLAW_HOOKS_TOKEN}
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD}
      XDG_CONFIG_HOME: ${XDG_CONFIG_HOME}
      FRITZBRIDGE_API_TOKEN: ${FRITZBRIDGE_API_TOKEN}
      PATH: /home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # v2026.10.5+: upgrades are image rebuilds reviewed in git, never in-place.
      # Disable gateway/node-host self-update and update checks.
      OPENCLAW_NO_AUTO_UPDATE: "1"
      # v2026.9.6+: the upstream entrypoint runs `doctor --fix` on every image
      # swap. One of its repairs can npm/ClawHub-install any plugin that is
      # configured but not present in the image. Defer that so a stale
      # plugins.entries key never pulls unreviewed code at boot.
      OPENCLAW_UPDATE_DEFER_CONFIGURED_PLUGIN_INSTALL_REPAIR: "1"
    ports: !override
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    depends_on:
      ollama:
        condition: service_healthy

  openclaw-cli:
    env_file:
      - .env
    environment:
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD}
      XDG_CONFIG_HOME: ${XDG_CONFIG_HOME}
      FRITZBRIDGE_API_TOKEN: ${FRITZBRIDGE_API_TOKEN}
      PATH: /home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # CPU-only host (no GPU): allow two concurrent embedding requests so memory
      # reindexes are not fully serialized. Keep one model resident to bound RAM.
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama-data:
